[project]
name = "rbdemo-backend"
version = "0.1.0"
description = "Royal Blinds multi-agent operations and product knowledge API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "langgraph==0.4.8",
    "langchain-openai==0.3.19",
    "openai==1.109.1",
    "supabase==2.32.0",
    "python-dotenv==1.1.0",
    "tzdata==2026.5",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "ruff==0.14.14",
]

[tool.uv]
package = false
# Preserve the previously tested transitive versions during the uv migration.
constraint-dependencies = [
    "langsmith==0.8.5",
    "websockets==14.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The repository's supabase/ SQL folder is not the Python SDK package.
known-third-party = ["supabase"]

[tool.ruff.lint.per-file-ignores]
# Direct CLI execution needs its backend path before importing app modules.
"**/scripts/*.py" = ["E402"]
# Optional database tooling is imported only after the disposable-DB gate.
"**/tests/test_database_sql.py" = ["E402"]
